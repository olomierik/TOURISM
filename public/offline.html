<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6EEE3">
<title>Offline · Explore Tanzania</title>
<!--
  Shown by the service worker (app/sw.ts) when a page that was never opened
  before is requested with no connection. Deliberately one self-contained file
  with no app code: an app page would try to load code that is not on the phone
  and fail with an error screen instead.
-->
<style>
  :root { color-scheme: light dark; --bg:#F6EEE3; --card:#fff; --ink:#2A211B; --muted:#6B5D52; --line:#E6DACB; --cta:#A8552F; --cta-ink:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1B1613; --card:#26201C; --ink:#F3ECE3; --muted:#C2B4A6; --line:#3B322B; --cta:#E39A6A; --cta-ink:#2A1A10; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
    background: linear-gradient(180deg, color-mix(in oklab, var(--bg) 85%, #d9c2a6) 0%, var(--bg) 70%);
    color:var(--ink); font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:32px 28px; text-align:center; }
  .chip { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:13px; color:var(--muted); }
  h1 { margin:18px 0 8px; font: 700 30px/1.15 Georgia, "Times New Roman", serif; letter-spacing:-0.02em; }
  p { margin:0; color:var(--muted); }
  .row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
  a, button { display:inline-flex; align-items:center; justify-content:center; height:44px; padding:0 22px; border-radius:999px; font:600 15px/1 inherit; font-family:inherit; text-decoration:none; cursor:pointer; }
  .primary { background:var(--cta); color:var(--cta-ink); border:0; }
  .secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <span class="chip">Offline · Nje ya mtandao</span>
  <h1>You’re offline</h1>
  <p>This page isn’t saved on your phone yet. Pages you have already opened still work — go back to one of them, or try again once you have a signal.</p>
  <div class="row">
    <button class="primary" type="button" onclick="location.reload()">Try again</button>
    <a class="secondary" href="/wildlife">Wildlife guide</a>
  </div>
</main>
</body>
</html>
